name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, order-service, notification-service, api-gateway]

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Instaliraj zavisnosti - ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm ci

      - name: Lint - ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm run lint

      - name: Build - ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm run build

      - name: Testovi - ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm test -- --passWithNoTests

      - name: Upload test rezultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service: [user-service, product-service, order-service, notification-service, api-gateway]

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Build Docker image - ${{ matrix.service }}
        run: |
          docker build \
            -t ecommerce-${{ matrix.service }}:${{ github.sha }} \
            -t ecommerce-${{ matrix.service }}:latest \
            ./services/${{ matrix.service }}

      - name: Test Docker image zdravlje - ${{ matrix.service }}
        run: |
          echo "Docker image ecommerce-${{ matrix.service }}:${{ github.sha }} uspjesno buildovan"
